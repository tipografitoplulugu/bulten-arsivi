<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../">
  <title>Typography Newsletter Archive</title>
  <meta name="description" content="Read the full English translation of a Typography Newsletter issue.">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script>
    (() => {
      const savedTheme = localStorage.getItem("tipografi-archive-theme");
      const queryTheme = new URLSearchParams(window.location.search).get("theme");
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      const theme = queryTheme === "dark" || queryTheme === "light" ? queryTheme : (savedTheme || systemTheme);
      document.documentElement.lang = "en";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div class="archive-container">
    <header class="archive-brand-header">
      <div class="brand-identity">
        <img class="brand-logo" src="logo.png" alt="Turkish Typography Society logo" width="48" height="48">
        <div class="brand-name">Turkish Typography Society</div>
      </div>
      <nav class="brand-links" aria-label="Publications">
        <a href="https://tipografi.substack.com/" target="_blank" rel="noopener noreferrer">Substack</a>
        <span aria-hidden="true">·</span>
        <a href="https://medium.com/tipografi" target="_blank" rel="noopener noreferrer">Medium</a>
      </nav>
      <nav class="language-toggle" aria-label="Language">
        <a href="./" lang="tr">TR</a>
        <a href="en/" class="active" lang="en" aria-current="page">EN</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      </button>
    </header>

    <hr class="hero-rule">

    <main class="issue-page">
      <a class="issue-back-link" href="en/">← Back to the archive</a>
      <p class="language-note" id="issue-translation-note" hidden>English translation. The original Turkish issue is linked below.</p>
      <div id="issue-status" class="app-status" role="status" aria-live="polite">Loading issue…</div>
      <article id="issue-content" class="issue-content" hidden></article>
      <p class="issue-original-link" id="issue-original-wrap" hidden>
        <a id="issue-original-link" href="#" target="_blank" rel="noopener noreferrer">Read the original issue in Turkish ↗</a>
      </p>
    </main>

    <hr class="hero-rule">

    <!-- Footer -->
    <footer class="archive-footer" aria-label="Footer">
      <div class="footer-content">
        <div class="footer-name" id="footer-name">Turkish Typography Society</div>
        <div class="footer-actions">
          <div class="footer-subscribe">
            <a id="subscribe-link" href="https://tipografi.substack.com/" target="_blank" rel="noopener noreferrer">Subscribe to the newsletter</a>
          </div>
          <nav class="footer-social" aria-label="Social media links">
            <a href="https://www.facebook.com/tipografi/" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-fill" d="M13.6 21v-8.2h2.8l.4-3.2h-3.2V7.5c0-.9.3-1.6 1.6-1.6H17V3.1c-.3 0-1.3-.1-2.4-.1-2.4 0-4.1 1.5-4.1 4.3v2.4H7.8v3.2h2.7V21z"/></svg>
            </a>
            <a href="https://x.com/tipografi" target="_blank" rel="noopener noreferrer" aria-label="X" title="X">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-fill" d="M18.9 2H22l-6.8 7.8L23 22h-6.2l-4.9-6.4L6.3 22H3.1l7.3-8.4L2.7 2h6.4l4.4 5.9L18.9 2zm-1.1 17.8h1.7L8.4 4.1H6.6z"/></svg>
            </a>
            <a href="https://www.instagram.com/tipografitoplulugu/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="icon-stroke" x="3.2" y="3.2" width="17.6" height="17.6" rx="5.1"/><circle class="icon-stroke" cx="12" cy="12" r="4.1"/><circle class="icon-fill" cx="17.7" cy="6.6" r="1.1"/></svg>
            </a>
            <a href="https://www.youtube.com/@tipografi" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-fill" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8z"/><path d="m9.6 15.8 6.2-3.8-6.2-3.8z" fill="var(--paper)"/></svg>
            </a>
            <a href="https://open.spotify.com/show/1Ij0BoHaoobj5Mez7mAS22" target="_blank" rel="noopener noreferrer" aria-label="Spotify" title="Spotify">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-fill" d="M12 1.8A10.2 10.2 0 1 0 12 22.2 10.2 10.2 0 0 0 12 1.8z"/><path d="M6.2 9.1c3.8-1.1 8.6-.7 11.7 1.2M7 12.1c3.2-.9 7.3-.5 9.9 1.1M7.8 15c2.6-.7 5.8-.4 7.9.9" fill="none" stroke="var(--paper)" stroke-width="1.4" stroke-linecap="round"/></svg>
            </a>
            <a href="https://tipografi.substack.com/" target="_blank" rel="noopener noreferrer" aria-label="Substack" title="Substack">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-fill" d="M3 4h18v2H3zm0 4h18v2H3zm0 4h18v2H3zm0 4h18v5l-9-3.5L3 21z"/></svg>
            </a>
          </nav>
        </div>
      </div>
    </footer>
  </div>
  <script src="en/issue.js"></script>
</body>
</html>
